name: ETF 주간 테마 리포트

# 토요일 오전 (금요일 PDF 확정 후). UTC 00:00 토 = KST 09:00 토
on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write        # 캐시·리포트 커밋

concurrency:
  group: etf-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 시스템 패키지(한글폰트)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fonts-nanum
          sudo fc-cache -f

      - name: 파이썬 라이브러리
        run: pip install -r cloud/requirements.txt

      - name: 주간 리포트 생성·전송
        env:
          TZ: Asia/Seoul
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TELEGRAM_TOKEN2: ${{ secrets.TELEGRAM_TOKEN2 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}     # 채널1 @pefscreener (봇1)
          TELEGRAM_CHAT_ID2: ${{ secrets.TELEGRAM_CHAT_ID2 }}   # 채널2 수급방 (봇2)
          TELEGRAM_DM_ID: ${{ secrets.TELEGRAM_DM_ID }}         # 내 DM (봇2)
          # 발송처 on/off — 1이면 보냄
          WEEKLY_TO_CH1: "1"      # @pefscreener
          WEEKLY_TO_CH2: "0"      # 수급방 (원하면 1로)
          WEEKLY_TO_DM:  "1"      # 내 DM
        run: python analysis_20d/weekly_run.py

      - name: 캐시·리포트 커밋 (다음 주엔 새 5일치만 받도록)
        run: |
          mkdir -p reports
          mv -f analysis_20d/주간_*.png reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f analysis_20d/*.json reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "주간 테마 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
