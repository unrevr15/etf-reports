name: ETF PDF 변화 일일 자동

# 스케줄은 UTC 기준 (한국=UTC+9). 평일/휴장 판단은 스크립트가 알아서 함.
#   UTC 21,22,23 → KST 06,07,08 / UTC 0,1 → KST 09,10 / UTC 7 → KST 16(늦게 뜨는 TIGER)
#   UTC 22:30 → KST 07:30 = 텔레그램 채널 전송 시각(이 실행에서만 전송)
on:
  schedule:
    - cron: "0 21,22,23 * * *"
    - cron: "30 22 * * *"     # KST 07:30 — @pefscreener 채널 전송
    - cron: "0 0,1 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼(전송도 함)

permissions:
  contents: write          # 리포트를 레포에 커밋하기 위해

concurrency:
  group: etf-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 시스템 패키지(한글폰트·rclone)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fonts-nanum rclone
          sudo fc-cache -f

      - name: 파이썬 라이브러리
        run: pip install -r cloud/requirements.txt

      - name: rclone 설정(시크릿 → 파일, 있을 때만)
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: 실행(리포트 생성)
        env:
          TZ: Asia/Seoul
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || 'gdrive:etf_reports' }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}   # 전체매매금액(상장좌수)·비중(순자산) 계산용
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}     # 표 이미지 텔레그램 전송(있을 때만)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} # 채널: @pefscreener
          # 07:30 실행 또는 수동실행일 때만 채널 전송(나머지 실행은 렌더/저장만 → 채널 도배 방지)
          TELEGRAM_SEND: ${{ github.event.schedule == '30 22 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python cloud/run_daily.py

      - name: 리포트를 레포에 커밋 (reports/)
        run: |
          mkdir -p reports
          mv -f pdf_change_*.xlsx pdf_change_*.png pdf_weekly_*.xlsx pdf_rolling*.xlsx portfolio_*.png reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/
          if git diff --cached --quiet; then
            echo "변경 없음(휴장/미게시)"
          else
            git commit -m "리포트 $(TZ=Asia/Seoul date +%Y-%m-%d_%H%M)"
            git push
          fi
