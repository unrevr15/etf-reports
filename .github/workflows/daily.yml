name: ETF PDF 변화 일일 자동

# 스케줄은 UTC 기준 (한국=UTC+9). 평일/휴장 판단은 스크립트가 알아서 함.
#   UTC 21,22,23 → KST 06,07,08 / UTC 0,1 → KST 09,10 / UTC 7 → KST 16(늦게 뜨는 TIGER)
#   UTC 22:10~23:40 → KST 07:10~08:40 = 전송 후보(완결되면 즉시 / 8:40 넘으면 되는대로, 하루 1회)
on:
  schedule:
    - cron: "0 21,22,23 * * *"
    - cron: "10,20,30,40 22 * * *"   # KST 07:10·20·30·40 — 전송 후보
    - cron: "20,40 23 * * *"         # KST 08:20·40 — 전송 후보(늦게 게시하는 운용사 대비)
    - cron: "0 0,1 * * *"
    - cron: "0 7 * * *"
  # 수동 실행은 기본적으로 방에 발송하지 않음(렌더·저장만). 보내려면 force_send 체크.
  workflow_dispatch:
    inputs:
      force_send:
        description: "방(@pefscreener·수급방)으로 실제 발송"
        type: boolean
        default: false

permissions:
  contents: write          # 리포트를 레포에 커밋하기 위해

concurrency:
  group: etf-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 시스템 패키지(한글폰트·rclone)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fonts-nanum rclone
          sudo fc-cache -f

      - name: 파이썬 라이브러리
        run: pip install -r cloud/requirements.txt

      - name: rclone 설정(시크릿 → 파일, 있을 때만)
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: 실행(리포트 생성)
        env:
          TZ: Asia/Seoul
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || 'gdrive:etf_reports' }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}   # 전체매매금액(상장좌수)·비중(순자산) 계산용
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}     # 채널1(색상·가로): @pefscreener
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN2: ${{ secrets.TELEGRAM_TOKEN2 }}   # 채널2(무채색·모바일): 신규 방(있을 때만)
          TELEGRAM_CHAT_ID2: ${{ secrets.TELEGRAM_CHAT_ID2 }}
          # 블로그 대시보드 업로드 (없으면 조용히 건너뜀 — 선택 기능)
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://blog-dashboard.memchipdash.workers.dev' }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          # 아침 실행(06~10시)·수동은 전송 후보 → run_daily가 7:10↑ & 완결/7:35마감 판정(중복은 마커로 차단)
          # 7:10~7:40 통째 스킵돼도 08·09·10시 실행이 마감판정으로 자동 발송(GitHub 스킵 복구)
          # 정규 스케줄에서만 발송. 수동 실행은 force_send를 켰을 때만.
          TELEGRAM_SEND: ${{ github.event.schedule == '10,20,30,40 22 * * *' || github.event.schedule == '20,40 23 * * *' || github.event.schedule == '0 21,22,23 * * *' || github.event.schedule == '0 0,1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.force_send) }}
        run: python cloud/run_daily.py

      - name: 리포트를 레포에 커밋 (reports/)
        run: |
          mkdir -p reports
          mv -f pdf_change_*.xlsx pdf_change_*.png pdf_weekly_*.xlsx pdf_rolling*.xlsx portfolio_*.png reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/
          if git diff --cached --quiet; then
            echo "변경 없음(휴장/미게시)"
          else
            git commit -m "리포트 $(TZ=Asia/Seoul date +%Y-%m-%d_%H%M)"
            git push
          fi
